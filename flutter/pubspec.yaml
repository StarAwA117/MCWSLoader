name: mcwsloader
description: Standalone MCWSLoader desktop and mobile app
publish_to: "none"
version: 2.0.1-beta.1+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  webview_all: ^1.5.0
  node_flutter: ^0.0.4
  archive: ^4.0.2
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/server.tar.gz
    - assets/node/
